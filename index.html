<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notícias PSV</title>
<style>
  :root { --fundo:#0b0f14; --texto:#fff; --destaque:#1e9e4a; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { width:100%; height:100%; overflow:hidden; background:var(--fundo); color:var(--texto);
    font-family:"Segoe UI",system-ui,Arial,sans-serif; cursor:none; }
  #palco { position:fixed; left:0; top:0; bottom:0; width:78%; overflow:hidden; }
  .slide { position:absolute; inset:0; opacity:0; transition:opacity 1s ease; }
  .slide.ativo { opacity:1; }
  .mosaico { position:absolute; inset:0; display:grid; gap:6px; background:#000; }
  .mosaico .foto { position:relative; overflow:hidden; background:#1b222b; }
  .mosaico img { width:100%; height:100%; object-fit:cover; display:block; }
  .slide.ativo .mosaico img { animation:zoom 18s linear forwards; }
  @keyframes zoom { from{transform:scale(1)} to{transform:scale(1.06)} }
  .mais { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:rgba(0,0,0,.55); font-size:6vh; font-weight:700; }

  /* grelhas por nº de fotos */
  .n1 { grid-template-columns:1fr; grid-template-rows:1fr; }
  .n2 { grid-template-columns:1fr 1fr; grid-template-rows:1fr; }
  .n3 { grid-template-columns:2fr 1fr; grid-template-rows:1fr 1fr; }
  .n3 .foto:first-child { grid-row:1 / span 2; }
  .n4 { grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; }
  .n5 { grid-template-columns:repeat(6,1fr); grid-template-rows:1fr 1fr; }
  .n5 .foto:nth-child(-n+2) { grid-column:span 3; }
  .n5 .foto:nth-child(n+3) { grid-column:span 2; }
  .n6 { grid-template-columns:repeat(3,1fr); grid-template-rows:1fr 1fr; }

  .rodape { position:absolute; left:0; right:0; bottom:0; padding:9vh 4vw 5vh;
    background:linear-gradient(to top, rgba(0,0,0,.88) 0%, rgba(0,0,0,.72) 55%, rgba(0,0,0,0) 100%); }
  .rodape h1 { font-size:4.6vh; line-height:1.15; font-weight:700; margin-bottom:1.2vh;
    border-left:.8vh solid var(--destaque); padding-left:1.4vw; text-shadow:0 2px 8px rgba(0,0,0,.6); }
  .rodape p { font-size:3.2vh; line-height:1.35; display:-webkit-box; -webkit-line-clamp:4;
    -webkit-box-orient:vertical; overflow:hidden; white-space:pre-line; text-shadow:0 2px 8px rgba(0,0,0,.6); }
  .rodape small { display:block; margin-top:1.4vh; font-size:2.2vh; opacity:.75; }

  /* só texto */
  .soTexto { background:radial-gradient(ellipse at top left,#1c2a3a,#0b0f14); }
  .soTexto .rodape { top:0; background:none; display:flex; flex-direction:column; justify-content:center; padding:8vh 8vw; }
  .soTexto .rodape h1 { font-size:7vh; margin-bottom:3vh; }
  .soTexto .rodape p { font-size:4.4vh; -webkit-line-clamp:9; }

  #progresso { position:fixed; left:0; bottom:0; height:.7vh; width:0; max-width:78%; background:var(--destaque); z-index:10; }
  #vazio { position:fixed; left:0; top:0; bottom:0; width:78%; text-align:center; padding:0 4vw; display:none; align-items:center; justify-content:center; font-size:5vh; opacity:.8; }

  /* barra lateral */
  #lateral { position:fixed; right:0; top:0; bottom:0; width:22%; display:flex; flex-direction:column; align-items:center;
    justify-content:space-between; padding:3.5vh 1.2vw; text-align:center;
    background:linear-gradient(170deg,#23a853 0%,#1e9e4a 45%,#14733a 100%); box-shadow:-.6vh 0 2vh rgba(0,0,0,.45); z-index:5; }
  #lateral .logo { background:#fff; border-radius:1.6vh; padding:1.6vh 1.2vw; width:100%; display:flex; flex-direction:column; align-items:center; gap:1.4vh; }
  #lateral .logo img { width:100%; max-width:100%; height:auto; display:block; }
  #lateral .logo .fin { border-top:.2vh solid #e3e7ea; padding-top:1.4vh; }
  #hora { font-size:9.5vh; font-weight:700; line-height:1; letter-spacing:.02em; font-variant-numeric:tabular-nums; text-shadow:0 .3vh 1vh rgba(0,0,0,.25); }
  #diasemana { font-size:3.4vh; font-weight:600; margin-top:1.4vh; }
  #data { font-size:2.8vh; opacity:.92; margin-top:.4vh; }
  .sep { width:70%; height:.25vh; background:rgba(255,255,255,.45); border-radius:1vh; margin:0 auto; }
  #tempo { width:100%; }
  #tempo .agora { display:flex; align-items:center; justify-content:center; gap:1vw; }
  #tempo .agora svg { width:9vh; height:9vh; flex:none; }
  #tempo .temp { font-size:8vh; font-weight:700; line-height:1; }
  #tempo .desc { font-size:2.8vh; margin-top:.8vh; opacity:.95; }
  #tempo .local { font-size:2.3vh; opacity:.8; margin-bottom:1.2vh; }
  #tempo .minmax { font-size:2.6vh; margin-top:.6vh; opacity:.95; }
  #tempo .prox { margin-top:2vh; display:flex; flex-direction:column; gap:1vh; }
  #tempo .dia { display:flex; align-items:center; justify-content:space-between; background:rgba(0,0,0,.14); border-radius:1.2vh; padding:.8vh 1vw; font-size:2.5vh; }
  #tempo .dia svg { width:4.4vh; height:4.4vh; }
  #tempo .dia .nome { width:35%; text-align:left; }
  #tempo .dia .mm { width:40%; text-align:right; }
</style>
</head>
<body>
<div id="palco"></div>
<div id="progresso"></div>
<aside id="lateral">
  <div class="logo"><img src="logo.png" alt="Escola Profissional de Aveiro"><img class="fin" src="logo-financiamento.png" alt="Pessoas 2030, Portugal 2030, Cofinanciado pela União Europeia"></div>
  <div class="relogio">
    <div id="hora">--:--</div>
    <div id="diasemana"></div>
    <div id="data"></div>
  </div>
  <div class="sep"></div>
  <div id="tempo"></div>
</aside>
<div id="vazio">Escola Profissional de Aveiro – Pólo de Sever do Vouga</div>
<script>
(function(){
  var DEMO = /[?&]demo=1/.test(location.search);
  var URL_JSON = DEMO ? 'exemplo/noticias.json' : 'noticias.json';
  var BASE = DEMO ? 'exemplo/' : '';
  var cfg = { segundos:12, recarregarMinutos:5 };
  var noticias = [];
  var indice = -1, atual = null, timer = null;
  var palco = document.getElementById('palco');
  var barra = document.getElementById('progresso');
  var vazio = document.getElementById('vazio');

  function esc(s){ var d=document.createElement('div'); d.textContent=s==null?'':String(s); return d.innerHTML; }

  function dataPT(iso){
    try { return new Date(iso).toLocaleDateString('pt-PT',{day:'numeric',month:'long',year:'numeric'}); }
    catch(e){ return ''; }
  }

  function duracao(n){
    var base = cfg.segundos || 12;
    var len = (n.texto||'').length;
    var extra = Math.min(4, Math.floor(len/150));
    return Math.min(base + extra, 16);
  }

  function construir(n){
    var el = document.createElement('div');
    el.className = 'slide';
    var fotos = (n.fotos||[]);
    var html = '';
    if (fotos.length){
      var k = Math.min(fotos.length, 6);
      html += '<div class="mosaico n'+k+'">';
      for (var i=0;i<k;i++){
        html += '<div class="foto"><img src="'+esc(BASE+fotos[i])+'" alt="">';
        if (i===5 && fotos.length>6) html += '<div class="mais">+'+(fotos.length-5)+'</div>';
        html += '</div>';
      }
      html += '</div>';
    } else {
      el.classList.add('soTexto');
    }
    var linhas = (n.texto||'').trim().split(/\n+/);
    var titulo = n.titulo || linhas.shift() || '';
    if (!n.titulo && linhas.length===0) linhas = [];
    var corpo = n.titulo ? (n.texto||'') : linhas.join('\n');
    var meta = [n.autor, n.data?dataPT(n.data):''].filter(Boolean).join(' · ');
    html += '<div class="rodape"><h1>'+esc(titulo)+'</h1>'+(corpo?'<p>'+esc(corpo)+'</p>':'')+(meta?'<small>'+esc(meta)+'</small>':'')+'</div>';
    el.innerHTML = html;
    // ignorar imagens que falham
    Array.prototype.forEach.call(el.querySelectorAll('.foto img'), function(img){
      img.onerror = function(){ var f=img.parentNode; if(f&&f.parentNode) f.parentNode.removeChild(f); };
    });
    return el;
  }


  // ---------- barra lateral: hora, data, tempo ----------
  var TZ = 'Europe/Lisbon';
  function cap(t){ return t ? t.charAt(0).toUpperCase()+t.slice(1) : t; }
  function relogio(){
    var d = new Date();
    document.getElementById('hora').textContent = d.toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit',timeZone:TZ});
    document.getElementById('diasemana').textContent = cap(d.toLocaleDateString('pt-PT',{weekday:'long',timeZone:TZ}));
    document.getElementById('data').textContent = d.toLocaleDateString('pt-PT',{day:'numeric',month:'long',year:'numeric',timeZone:TZ});
  }
  relogio(); setInterval(relogio, 1000);

  var W = '#fff';
  function sol(){ return '<circle cx="32" cy="32" r="11" fill="#ffd93b"/><g stroke="#ffd93b" stroke-width="4" stroke-linecap="round"><path d="M32 8v7M32 49v7M8 32h7M49 32h7M15 15l5 5M44 44l5 5M49 15l-5 5M20 44l-5 5"/></g>'; }
  function nuvem(c,dx,dy){ c=c||W; dx=dx||0; dy=dy||0; return '<path transform="translate('+dx+' '+dy+')" d="M18 46a10 10 0 0 1-1-19.9A13 13 0 0 1 42 22a11 11 0 0 1 4 24z" fill="'+c+'"/>'; }
  function gotas(){ return '<g stroke="#bfe3ff" stroke-width="4" stroke-linecap="round"><path d="M22 52l-3 7M33 52l-3 7M44 52l-3 7"/></g>'; }
  function icone(code, noite){
    var g;
    if (code===0) g = noite ? '<path d="M40 12a20 20 0 1 0 12 30A17 17 0 0 1 40 12z" fill="#ffe99a"/>' : sol();
    else if (code<=2) g = (noite?'':'<g transform="translate(-6 -8) scale(.75)">'+sol()+'</g>')+nuvem(W,2,0);
    else if (code===3) g = nuvem('#e6eef0',0,0);
    else if (code===45||code===48) g = nuvem('#dfe9eb',0,-4)+'<g stroke="#fff" stroke-width="4" stroke-linecap="round"><path d="M14 52h36M20 59h28"/></g>';
    else if ((code>=51&&code<=67)||(code>=80&&code<=82)) g = nuvem('#dfe9eb',0,-6)+gotas();
    else if ((code>=71&&code<=77)||code===85||code===86) g = nuvem('#e6eef0',0,-6)+'<g fill="#fff"><circle cx="22" cy="55" r="3"/><circle cx="33" cy="58" r="3"/><circle cx="44" cy="55" r="3"/></g>';
    else if (code>=95) g = nuvem('#c9d3d6',0,-6)+'<path d="M35 44l-8 12h7l-3 8 11-14h-7z" fill="#ffd93b"/>';
    else g = nuvem();
    return '<svg viewBox="0 0 64 64" aria-hidden="true">'+g+'</svg>';
  }
  var DESC = {0:'Céu limpo',1:'Pouco nublado',2:'Parcialmente nublado',3:'Nublado',45:'Nevoeiro',48:'Nevoeiro',51:'Chuvisco',53:'Chuvisco',55:'Chuvisco',56:'Chuvisco gelado',57:'Chuvisco gelado',61:'Chuva fraca',63:'Chuva',65:'Chuva forte',66:'Chuva gelada',67:'Chuva gelada',71:'Neve fraca',73:'Neve',75:'Neve forte',77:'Neve granulada',80:'Aguaceiros',81:'Aguaceiros',82:'Aguaceiros fortes',85:'Aguaceiros de neve',86:'Aguaceiros de neve',95:'Trovoada',96:'Trovoada com granizo',99:'Trovoada com granizo'};
  function carregarTempo(){
    var u = 'https://api.open-meteo.com/v1/forecast?latitude=40.7333&longitude=-8.3667&current=temperature_2m,weather_code,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Europe%2FLisbon&forecast_days=3';
    fetch(u).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); }).then(function(j){
      var c = j.current, d = j.daily;
      var h = '<div class="local">Sever do Vouga</div>'+
        '<div class="agora">'+icone(c.weather_code, c.is_day===0)+'<div class="temp">'+Math.round(c.temperature_2m)+'°</div></div>'+
        '<div class="desc">'+esc(DESC[c.weather_code]||'')+'</div>'+
        '<div class="minmax">Mín '+Math.round(d.temperature_2m_min[0])+'° · Máx '+Math.round(d.temperature_2m_max[0])+'°</div>'+
        '<div class="prox">';
      for (var i=1;i<3;i++){
        var nome = i===1 ? 'Amanhã' : new Date(d.time[i]+'T12:00:00').toLocaleDateString('pt-PT',{weekday:'long'}).split('-')[0];
        h += '<div class="dia"><span class="nome">'+esc(cap(nome))+'</span>'+icone(d.weather_code[i])+'<span class="mm">'+Math.round(d.temperature_2m_min[i])+'° / '+Math.round(d.temperature_2m_max[i])+'°</span></div>';
      }
      document.getElementById('tempo').innerHTML = h+'</div>';
    }).catch(function(e){ console.warn('Tempo indisponível', e); /* mantém o último valor; se nunca carregou, o bloco fica vazio */ });
  }
  carregarTempo(); setInterval(carregarTempo, 30*60000);

  function precarregar(){
    if (!noticias.length) return;
    var prox = noticias[(indice+1) % noticias.length];
    (prox.fotos||[]).slice(0,6).forEach(function(f){ var im = new Image(); im.src = BASE+f; });
  }

  function mostrar(){
    clearTimeout(timer);
    if (!noticias.length){ vazio.style.display='flex'; barra.style.width='0'; timer=setTimeout(mostrar,30000); return; }
    vazio.style.display='none';
    indice = (indice+1) % noticias.length;
    var n = noticias[indice];
    var el = construir(n);
    palco.appendChild(el);
    void el.offsetWidth;
    el.classList.add('ativo');
    if (atual){ var velho=atual; velho.classList.remove('ativo'); setTimeout(function(){ if(velho.parentNode) velho.parentNode.removeChild(velho); },1200); }
    atual = el;
    var d = duracao(n);
    barra.style.transition='none'; barra.style.width='0'; void barra.offsetWidth;
    barra.style.transition='width '+d+'s linear'; barra.style.width='100%';
    timer = setTimeout(mostrar, d*1000);
    precarregar();
  }

  function carregar(primeira){
    return fetch(URL_JSON+'?t='+Date.now(), {cache:'no-store'})
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(j){
        if (!j || !Array.isArray(j.noticias)) throw new Error('formato');
        if (j.config) { cfg.segundos = j.config.segundos || cfg.segundos; cfg.recarregarMinutos = j.config.recarregarMinutos || cfg.recarregarMinutos; }
        var agora = Date.now();
        noticias = j.noticias.filter(function(n){
          if (n.inicio && new Date(n.inicio).getTime() > agora) return false;
          if (n.fim && new Date(n.fim).getTime() < agora) return false;
          return true;
        }).slice(0,10);
        if (indice >= noticias.length) indice = -1;
      })
      .catch(function(e){ /* mantém os dados anteriores */ console.warn('Falha a carregar', e); })
      .then(function(){ if (primeira) mostrar(); });
  }

  carregar(true);
  setInterval(function(){ carregar(false); }, (cfg.recarregarMinutos||5)*60000);
  // recarregamento completo periódico (evita fugas de memória)
  setTimeout(function(){ location.reload(); }, 6*3600*1000);
})();
</script>
</body>
</html>
